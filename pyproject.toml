[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.1.0"
description = "A tree-sitter code knowledge graph for token-efficient code retrieval and generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vinod Narayanswamy" }]
keywords = ["tree-sitter", "knowledge-graph", "llm", "code-retrieval", "rag", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/USERNAME/codegraph"
Issues = "https://github.com/USERNAME/codegraph/issues"

[project.scripts]
codegraph-demo = "examples.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]
